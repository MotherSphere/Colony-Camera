# Camera Colony 0.2.0 candidate. Ctrl+F7 opens the native settings menu.
# Menu edits apply immediately; General > Save persists them with an INI .bak.
# Keep your existing INI when upgrading. Older files retain their key bindings.
# Values must be finite; unknown/duplicate keys or invalid values reject a reload.

[general]
format_version=2
enabled=true
# SKSE keyboard scan codes, always with Ctrl: F8/F9/F10; F7 opens settings.
# Valid codes: 1..211, excluding 29/157 (Ctrl). Each binding must be distinct.
toggle_key=66
shoulder_key=67
reload_key=68
menu_key=65

[first_person]
# Opt-in body experiment; native camera and native first-person arms retained.
# Equipment, clipping, shadows and body alignment need visual testing.
# Special states fall back to native. Not complete Improved Camera functionality.
enabled=false

# Profile values are additions to Skyrim's native third-person camera.
# x/y/z: lateral/depth/height in game units, -300..300.
# half_life: position error half-life in seconds, 0..1; 0 follows immediately.
# max_lag: position lag cap in game units, 0..300; 0 removes following lag.
# offset_half_life: independent profile/shoulder-offset half-life, 0..1 seconds.
# zoom: additional camera-local depth, -300..300, added to y; native zoom remains.
# zoom_half_life: additional-depth half-life, 0..1 seconds.
# fov_offset: world-FOV delta in degrees, -60..60; 0 requests native FOV.
# fov_half_life: FOV-delta half-life, 0..1 seconds. Nonzero targets use 30..150 FOV.
# Each half-life uses exponential interpolation. Zero means immediate.

[exploration]
x=0
y=0
z=0
half_life=0.08
max_lag=60
offset_half_life=0.08
zoom=0
zoom_half_life=0.12
fov_offset=0
fov_half_life=0.12

[combat]
x=0
y=0
z=0
half_life=0.04
max_lag=30
offset_half_life=0.04
zoom=0
zoom_half_life=0.12
fov_offset=0
fov_half_life=0.12

# Native aim by default: no added displacement, FOV or lag.
# There is no projectile/crosshair correction for custom aiming offsets.
[aim]
x=0
y=0
z=0
half_life=0
max_lag=0
offset_half_life=0
zoom=0
zoom_half_life=0
fov_offset=0
fov_half_life=0

# Optional third-person overrides, off by default. Explicit active=false matters:
# an optional section with no active key opts in. Precedence among active profiles:
# aim > swim > sneak > sprint > airborne > combat > exploration.
[sprint]
active=false
x=0
y=0
z=0
half_life=0.06
max_lag=60
offset_half_life=0.08
zoom=0
zoom_half_life=0.12
fov_offset=0
fov_half_life=0.12

