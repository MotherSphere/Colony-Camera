# Colony Camera 0.1.1 alpha. Offsets are ADDITIONS to Skyrim's native camera.
# x: lateral, y: camera-local depth, z: height, in game units (+/-300).
# half_life: seconds to halve remaining error (0 disables smoothing).
# max_lag: maximum distance behind desired camera (0 snaps).
# Ctrl + scan code; defaults are Ctrl+F8 toggle, Ctrl+F9 shoulder, Ctrl+F10 reload.
[general]
enabled=true
toggle_key=66
shoulder_key=67
reload_key=68

[exploration]
x=0
y=0
z=0
half_life=0.08
max_lag=60

[combat]
x=0
y=0
z=0
half_life=0.04
max_lag=30

# Native aim by default: no displacement or lag that could misalign the crosshair.
[aim]
x=0
y=0
z=0
half_life=0
max_lag=0
